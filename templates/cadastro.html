{% extends "base.html" %}


{% block title %}
    Criar conta | Voz Cidadã
{% endblock %}


{% block content %}

<section class="pagina-formulario">

    <div class="formulario-container">

        <div class="formulario-cabecalho">

            <span>
                VOZ CIDADÃ
            </span>

            <h1>
                Crie sua conta
            </h1>

            <p>
                Cadastre-se para participar e registrar
                manifestações da comunidade.
            </p>

        </div>


        <form method="POST" class="formulario">


            <div class="campo">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >

            </div>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    required
                >

            </div>


            <button type="submit" class="botao botao-principal botao-largo">

                Criar conta

            </button>

        </form>


        <p class="texto-formulario">

            Já possui uma conta?

            <a href="{{ url_for('login') }}">
                Entrar
            </a>

        </p>

    </div>

</section>

{% endblock %}
