{% extends "base.html" %}


{% block title %}
    Nova manifestação | Voz Cidadã
{% endblock %}


{% block content %}

<section class="pagina-formulario">

    <div class="formulario-container formulario-grande">


        <div class="formulario-cabecalho">

            <span>
                NOVA MANIFESTAÇÃO
            </span>

            <h1>
                Registre uma situação
            </h1>

            <p>
                Preencha as informações para registrar um problema,
                reclamação ou sugestão.
            </p>

        </div>


        <form method="POST" class="formulario">


            <div class="campo">

                <label for="titulo">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="Ex: Buraco na rua principal"
                    required
                >

            </div>


            <div class="campo">

                <label for="categoria_id">
                    Categoria
                </label>

                <select
                    id="categoria_id"
                    name="categoria_id"
                    required
                >

                    <option value="">
                        Selecione uma categoria
                    </option>

                    {% for categoria in categorias %}

                        <option value="{{ categoria.id }}">

                            {{ categoria.nome }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="campo">

                <label for="localizacao">
                    Localização
                </label>

                <input
                    type="text"
                    id="localizacao"
                    name="localizacao"
                    placeholder="Informe a rua ou local"
                    required
                >

            </div>


            <div class="campo">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    name="descricao"
                    rows="6"
                    placeholder="Descreva a situação encontrada..."
                    required
                ></textarea>

            </div>


            <button type="submit" class="botao botao-principal botao-largo">

                Registrar manifestação

            </button>

        </form>

    </div>

</section>

{% endblock %}
