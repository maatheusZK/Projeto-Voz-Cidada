{% extends "base.html" %}


{% block title %}
    Editar manifestação | Voz Cidadã
{% endblock %}


{% block content %}

<section class="pagina-formulario">

    <div class="formulario-container formulario-grande">


        <div class="formulario-cabecalho">

            <span>
                EDITAR MANIFESTAÇÃO
            </span>

            <h1>
                Atualize as informações
            </h1>

            <p>
                Faça as alterações necessárias no registro.
            </p>

        </div>


        <form method="POST" class="formulario">


            <div class="campo">

                <label for="titulo">
                    Título
                </label>

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    value="{{ manifestacao.titulo }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="categoria_id">
                    Categoria
                </label>

                <select
                    id="categoria_id"
                    name="categoria_id"
                    required
                >

                    {% for categoria in categorias %}

                        <option
                            value="{{ categoria.id }}"

                            {% if categoria.id == manifestacao.categoria_id %}
                                selected
                            {% endif %}
                        >

                            {{ categoria.nome }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="campo">

                <label for="localizacao">
                    Localização
                </label>

                <input
                    type="text"
                    id="localizacao"
                    name="localizacao"
                    value="{{ manifestacao.localizacao }}"
                    required
                >

            </div>


            <div class="campo">

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    name="descricao"
                    rows="6"
                    required
                >{{ manifestacao.descricao }}</textarea>

            </div>


            <button type="submit" class="botao botao-principal botao-largo">

                Salvar alterações

            </button>

        </form>

    </div>

</section>

{% endblock %}
