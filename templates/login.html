{% extends "base.html" %}


{% block title %}
    Entrar | Voz Cidadã
{% endblock %}


{% block content %}

<section class="pagina-formulario">

    <div class="formulario-container">

        <div class="formulario-cabecalho">

            <span>
                BEM-VINDO
            </span>

            <h1>
                Entre na sua conta
            </h1>

            <p>
                Acesse o sistema Voz Cidadã.
            </p>

        </div>


        <form method="POST" class="formulario">


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


            <button type="submit" class="botao botao-principal botao-largo">

                Entrar

            </button>

        </form>


        <p class="texto-formulario">

            Ainda não possui uma conta?

            <a href="{{ url_for('cadastro') }}">
                Criar conta
            </a>

        </p>

    </div>

</section>

{% endblock %}
